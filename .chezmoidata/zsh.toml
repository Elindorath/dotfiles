# Single source of truth for the oh-my-zsh plugin list.
#
# Consumed by:
#   - private_dot_config/zsh/dot_zshrc.tmpl  -> the `plugins=()` array
#   - .chezmoiexternal.toml                  -> the `include` patterns limiting
#     which of the 360 plugins shipped by the oh-my-zsh archive are downloaded
#
# Order matters: oh-my-zsh sources plugins in array order, and plugins that wrap
# widgets (syntax highlighting) must come after the ones that define them.
#
# Fields:
#   name      plugin name, as oh-my-zsh expects it
#   builtin   true if it comes from the oh-my-zsh archive, false if provided by
#             an external or a source file under custom/plugins/
#   os        restrict to a single chezmoi OS (omit to load everywhere)
#   disabled  keep the entry and its comments as documentation, but comment the
#             plugin out of the array and do not download it
#   comments  lines emitted above the entry in the generated array

[[zsh.plugins]]
  name = "aws"
  builtin = true

[[zsh.plugins]]
  name = "bw"
  builtin = false

[[zsh.plugins]]
  name = "brew"
  builtin = true

[[zsh.plugins]]
  name = "clipboard"
  builtin = false
  comments = ["Not in oh-my-zsh: https://github.com/zpm-zsh/clipboard"]

[[zsh.plugins]]
