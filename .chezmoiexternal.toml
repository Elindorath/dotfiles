{{- $fontDir := "" }}
{{- if (.wsl) }}
{{-   $fontDir = "" }}
{{- else if (eq .chezmoi.os "darwin") }}
{{-   $fontDir = "Library/Fonts" }}
{{- else if (eq .chezmoi.os "linux") }}
{{-   $fontDir = ".local/share/fonts" }}
{{- end }}

{{- if ($fontDir) }}
["{{ $fontDir }}"]
  type = "archive"
  url = "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/Hack.tar.xz"
  exact = true
  refreshPeriod = "168h"
  include = ["*.ttf"]
{{- end }}

